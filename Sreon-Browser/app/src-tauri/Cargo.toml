[package]
name = "sreon-browser"
version = "0.1.0"
description = "A lightweight, Zen-inspired browser shell styled with Blue Liquid Glass"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api", "unstable"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[[bin]]
name = "sreon-browser"
path = "src/main.rs"

# Real build-speed wins: full LTO, single codegen unit, and stripped
# symbols make the compiled app both smaller and measurably faster to
# start/run than Cargo's defaults, at the cost of slower `cargo build`.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
